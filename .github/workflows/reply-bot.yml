name: reply-bot

on:
  schedule:
    - cron: "7 */6 * * *"   # 00:07, 06:07, 12:07, 18:07 UTC — each run lives ~5h45m
  workflow_dispatch:

concurrency:
  group: reply-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore telegram offset
        uses: actions/cache/restore@v4
        with:
          path: offset.txt
          key: telegram-offset-
          restore-keys: telegram-offset-

      - name: Install deps
        run: pip install -q flask requests pillow

      - name: Run bot loop
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_bot.py

      - name: Save telegram offset
        if: always()
        uses: actions/cache/save@v4
        with:
          path: offset.txt
          key: telegram-offset-${{ github.run_number }}
